<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주주환원 스크리닝</title>
<style>
/* 배치: 제목·요약 → 필터 → 핵심 숫자 → 그림 3개 → 표(행을 누르면 상세) */
:root{--bg:#fff;--fg:#1d1f22;--mut:#6a6d73;--line:#e2e3e6;--panel:#f6f6f7;--or:#f58220;--or-d:#c95f05;--or-l:#fce4d6;--navy:#043b72;--gr:#b5b7b9;--ok:#1a7f4b;--bad:#c62828;
--f:"KoPubWorld Dotum","KoPub돋움체_Pro Medium","Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f)}
.wrap{max-width:1480px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:20px}
h1{font-size:26px;line-height:1.25;margin:0;letter-spacing:-.02em}
h2{font-size:15px;margin:0;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-top:4px solid var(--or);padding-top:16px}
.lead{margin:6px 0 0;font-size:15px;max-width:78ch}.lead b{color:var(--or-d)}
.asof{color:var(--mut);font-size:12.5px;text-align:right}
.mut{color:var(--mut)}.small{font-size:12px}
.filters{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.chip,button.b{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:999px;padding:5px 13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:#fff}
.chip:hover,button.b:hover{border-color:var(--or)}
button.b{border-radius:4px}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
label.f{display:inline-flex;align-items:center;gap:7px;font-size:13px}
select,input[type=number],input[type=search]{font:inherit;font-size:13px;border:1px solid #cfd1d5;border-radius:4px;padding:5px 8px;background:#fff;color:var(--fg)}
input[type=number]{width:72px}input[type=search]{width:170px}input[type=checkbox]{accent-color:var(--or);width:15px;height:15px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border-block:1px solid var(--line)}
.kpi{padding:12px 16px;border-left:1px solid var(--line)}.kpi:first-child{border-left:0;padding-left:0}
.kpi b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.kpi span{font-size:12.5px;color:var(--mut)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.charts section{min-width:0}.charts .wide{grid-column:1/-1}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 8px}
svg{display:block;width:100%;overflow:visible}svg text{font-family:var(--f);font-size:11.5px;fill:var(--fg)}svg .t{fill:var(--mut);font-size:11px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.tw{overflow:auto;max-height:720px;border-block:1px solid var(--fg)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--fg);font-weight:700;font-size:12px;padding:8px 9px;text-align:right;white-space:nowrap;cursor:pointer;vertical-align:bottom;user-select:none}
th.l,td.l{text-align:left}th.m,td.m{text-align:center}th[aria-sort] {color:var(--or-d)}
td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid #eeeff1}
tbody tr{cursor:pointer}tbody tr:hover td{background:#fff6ee}tbody tr.pf td{background:#fafbfd}tbody tr.pf:hover td{background:#fff6ee}
td.nm,th.nm{position:sticky;left:0;z-index:1;background:#fff}th.nm{z-index:3}
td.nm b{font-weight:700}.tag{font-size:11px;color:var(--navy);border:1px solid #c5d3e2;border-radius:3px;padding:0 4px;margin-left:5px}
.ty{font-weight:700;font-size:12px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.bar{display:inline-block;height:9px;background:var(--or);vertical-align:middle;margin-right:7px;border-radius:1px}
.yr{display:inline-flex;gap:2px;vertical-align:middle}.yr i{font-style:normal;width:17px;height:17px;line-height:17px;text-align:center;font-size:10.5px;border-radius:2px;background:#f0f0f1;color:#8b8e93}
.yr i.k1{background:#fce4d6;color:#7b3b05}.yr i.k2{background:#f9bd87;color:#5d2b00}.yr i.k4{background:var(--or);color:#fff}
.ck{display:inline-flex;gap:3px;vertical-align:middle}.ck i{width:11px;height:11px;border-radius:50%;background:#e9e9eb}.ck i.y{background:var(--ok)}.ck i.x{background:#fff;border:2px solid var(--bad)}
.tip{position:fixed;z-index:20;pointer-events:none;background:#fff;border:1px solid #cfd1d5;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.13);padding:8px 10px;font-size:12.5px;line-height:1.5;max-width:270px}
dialog{border:1px solid var(--line);border-radius:8px;padding:0;width:min(780px,calc(100vw - 24px));max-height:calc(100vh - 32px);color:var(--fg);box-shadow:0 16px 50px rgba(0,0,0,.22)}
dialog::backdrop{background:rgba(20,22,26,.38)}.dlg{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.dh h2{font-size:21px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}.dg>div{min-width:0}
ul.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px}ul.cl li{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:start}ul.cl .ck{padding-top:4px}
details{border-top:1px solid var(--line);padding-top:12px;font-size:13px}summary{cursor:pointer;font-weight:700}details dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0 0}details dt{font-weight:700}details dd{margin:0;max-width:90ch}
.empty{padding:40px;text-align:center;color:var(--mut)}
@media(max-width:860px){.charts{grid-template-columns:minmax(0,1fr)}.wrap{padding:16px 16px 40px}.asof{text-align:left}.kpis{grid-template-columns:1fr 1fr}.kpi{padding-left:12px}.kpi:nth-child(odd){border-left:0;padding-left:0}details dl{grid-template-columns:1fr}h1{font-size:22px}}
@media print{.filters,.tabs .b,dialog{display:none}.tw{max-height:none;overflow:visible}}
</style>
</head>

  ['cov', 'FCF로 배당 감당', r => has(r.cov) ? r.cov >= 1 : null, r => has(r.cov) ? `${FE} FCF가 예상 배당총액의 ${fx(r.cov)}배` : 'FCF 컨센서스 없음'],

  <div class="tw"><table><thead><tr><th class="l" style="cursor:default"></th>${['ROIC', 'ROE', 'WACC', 'ROIC−ROE', 'ROIC−WACC', 'FCF(억원)'].map(h => `<th style="cursor:default">${h}</th>`).join('')}</tr></thead><tbody style="pointer-events:none"><tr><td class="l">${LA} 실적</td><td>${fx(r.roic)}</td><td>${fx(r.roe)}</td><td>${fx(r.wacc)}</td><td>${sg(r.re)}</td><td>${sg(r.rw)}</td><td>${fx(r.fA, 0)}</td></tr><tr><td class="l">${FE} 컨센서스</td><td>${fx(r.roicF)}</td><td>${fx(r.roeF)}</td><td>–</td><td>${sg(sub(r.roicF, r.roeF))}</td><td>–</td><td>${fx(r.fF, 0)}</td></tr></tbody></table></div>
  <div class="small">5년 누적 배당성향 <b>${fx(r.p5, 0)}%</b> (배당 ${fx(r.v5, 0)}억원 ÷ 지배순이익 ${fx(r.n5, 0)}억원), ${LA} 배당성향 <b>${fx(r.pay)}%</b>, 5년 자사주 취득 <b>${fx(r.bb)}%</b> (현재 보통주 수 대비), 5년 배당 횟수 <b>${r.tot}회</b> (${Y.map((y, i) => `${yy(y)}년 ${r.k[i]}`).join(' · ')})${has(r.nc) ? `, ${r.nq} ${r.nc < 0 ? '순차입금' : '순현금'} <b>${fx(Math.abs(r.nc), 0)}억원</b> (회사 시총의 ${sg(r.nr)}%)` : ''}${kin.length ? `<br>같은 회사: ${kin.map(x => `${esc(x.n)} ${fx(x.y, 2)}%`).join(', ')}` : ''}</div></div>`;
  if (!dlg.open) dlg.showModal(); dlg.scrollTop = 0; $('#dx').onclick = () => dlg.close();
  const H = 190, [s, W] = svg($('#dB'), H, '연도별 주당배당금'), v = [...r.d, r.dps], mx = Math.max(1, ...v), st = W / v.length;
  v.forEach((d, i) => { const h = d / mx * (H - 54), cx = st * i + st / 2, last = i === 5; el(s, 'rect', {x: cx - st * .3, y: H - 26 - h, width: st * .6, height: h, fill: last ? '#fce4d6' : '#f58220', stroke: last ? '#f58220' : 'none', 'stroke-dasharray': last ? '3 2' : ''}); el(s, 'text', {x: cx, y: H - 32 - h, 'text-anchor': 'middle'}, fx(d, 0)); el(s, 'text', {x: cx, y: H - 8, 'text-anchor': 'middle', class: 't'}, last ? FE : yy(Y[i]) + '년'); });
  el(s, 'line', {x1: 0, x2: W, y1: H - 26, y2: H - 26, stroke: '#7f7f7f', 'stroke-width': .75});
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ---- 저장·링크 ---- */
$('#csv').onclick = () => {
  const keys = [...new Set(TABS.flatMap(t => t[1]))].filter(k => k !== 'ok' && k !== 'k'), q = v => `"${String(has(v) ? v : '').replace(/"/g, '""')}"`;
  const head = ['코드', '종목', '구분', ...keys.map(k => C[k][0].replace('\n', ' ')), ...Y.map(y => `${yy(y)}년 배당횟수`), ...CK.map(c => c[1])];
  const t = '﻿' + [head, ...sorted(filt()).map(r => [r.c, r.n, r.pf ? '우선주' : '보통주', ...keys.map(k => C[k][1](r)), ...r.k, ...r.ck.map(v => v === true ? '통과' : v === false ? '미달' : '값 없음')])].map(a => a.map(q).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], {type: 'text/csv'})); a.download = `주주환원_스크리닝_${D.asof.replace(/-/g, '')}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#link').onclick = async () => { const b = $('#link'); try { await navigator.clipboard.writeText(location.href); b.textContent = '복사했습니다'; } catch { b.textContent = '주소창의 주소를 복사하세요'; } setTimeout(() => b.textContent = '조건 링크 복사', 1800); };

$('#asof').innerHTML = `주가·시총 ${esc(D.asof)} 종가<br>컨센서스 같은 날 기준 · 생성 ${esc(D.built)}`;
$('#legend').innerHTML = `우 = 우선주 (${FE} DPS는 보통주 컨센서스 + ${LA}년 우선주 가산금으로 추정). 확인 4개 순서: ${CK.map(c => esc(c[1])).join(' · ')}. 채운 초록 통과, 빈 빨강 미달, 회색 값 없음. 행을 누르면 상세가 열립니다.`;
$('#defs').innerHTML = [
  [`${FE} 배당수익률`, `${FE} DPS ÷ 종가. 보통주 DPS는 컨센서스(수정DPS, 연간 현금). 우선주 컨센서스는 찾지 못해 보통주 DPS + (${LA}년 우선주 DPS − ${LA}년 보통주 DPS)로 추정`],
  ['대상', '27E DPS 컨센서스가 있고 회사(보통주) 시총 3,000억원 이상인 보통주·우선주. 컨센서스가 없는 고배당주는 빠짐'.replace('27E', FE)],
  ['FCF 배당 커버', `${FE} FCF 컨센서스 ÷ 예상 배당총액(보통주+우선주, 자기주식 포함 주식 수). 지주사는 FCF가 연결 기준이라 실제 배당 여력보다 높게 나옴. FCF 수익률은 회사 보통주 시총 기준`],
  ['순현금/시총', '순현금 ÷ 회사 보통주 시총. 순현금은 현금·유동 금융자산에서 차입금·사채·리스부채를 뺀 값(퀀티와이즈 순부채의 부호를 바꿈)으로, 종목마다 값이 있는 가장 최근 분기말 연결 기준. 마이너스는 순차입금. 연결이라 자회사 소수주주 몫, 조선·건설의 선수금, 플랫폼의 고객 자금도 들어가고, 금융 자회사를 연결한 회사(현대차 등)는 할부금융 차입까지 포함됨. 은행·증권·보험은 제외. 우선주는 회사 값'],
  ['ROIC·ROE·WACC', `${LA} 실적(ROE는 지배) 및 ${FE} 컨센서스. 금융업은 ROIC·WACC 없음. 실적과 컨센서스의 ROIC는 산출 기준이 다를 수 있어 직접 비교하지 말 것`],
  ['유형', `ROIC−WACC 부호와 최근 분기말 순현금 여부로 나눔. ROIC는 ${LA} 실적과 ${FE} 컨센서스 중 고르며(유형 기준), WACC와 순현금은 같은 값을 씀. 두 ROIC는 산출 기준이 다를 수 있고 ${FE}는 이익 전망에 크게 좌우됨. ` + Object.values(TY).map(t => `${t[0]}(${t[1]}): ${t[2]}`).join('. ') + '. ROIC > WACC는 같은 성장에 필요한 재투자가 적어 배당 여력을 키우지만, 재투자가 더 가치 있어 배당 유인은 줄이므로 통과·미달로 보지 않음. ROIC는 이미 투자한 자본의 평균 수익률이라 앞으로 할 투자의 수익률과 다를 수 있음. 영업흑자인데 ROIC가 −10%보다 낮은 회사는 투하자본이 마이너스로 추정되어 구분하지 않음'],
  ['배당 횟수', '분기별 DPS가 0보다 큰 분기 수. 연도별 DPS는 수정 기준'],
  ['5년 누적 배당성향', '5년 배당총액 ÷ 5년 지배순이익 합. 적자 해가 있으면 높게 나오고, 합이 적자면 표시하지 않음'],
  ['자사주 취득', '5년간 보통주 취득 주식 수 ÷ 현재 보통주 수. 소각 여부와 금액을 반영하지 않아 총환원율이 아님'],
  ['업종', '29업종 분류'], ['출처', 'FnGuide QuantiWise. 투자 판단의 참고 자료이며 컨센서스는 실제와 다를 수 있음'],
].map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');

function go(tableOnly) {
  basis();
  const h = toHash(); try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch { /* file:// 로 열면 막는 브라우저가 있다 */ } syncControls();
  const rows = filt(); table(rows); if (tableOnly === true) return;
  const sus = rows.filter(r => r.ng === 0 && r.ok >= 3), t = [...rows].sort((a, b) => b.y - a.y)[0], jm = rows.filter(r => r.ck[3] === false).length;
  $('#lead').innerHTML = t ? `조건에 맞는 <b>${rows.length}종목</b> 가운데 ${FE} 배당수익률 1위는 <b>${esc(t.n)} ${fx(t.y, 1)}%</b>입니다. 미달 없이 확인 3개 이상을 통과한 종목은 <b>${sus.length}개</b>입니다.` : '조건에 맞는 종목이 없습니다.';
  const pc = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
  $('#kpis').innerHTML = [[fx(med(rows.map(r => r.y)), 1) + (rows.length ? '%' : ''), `${FE} 배당수익률 중앙값`], [pc(rows.filter(r => r.yrs === 5).length, rows.length), '5년 매년 배당한 종목'], [rows.length ? rows.filter(r => r.ty === 'A').length + '종목' : '–', '환원 확대 여지 (ROIC > WACC · 순현금)'], [fx(med(rows.map(r => r.p5)), 0) + (rows.length ? '%' : ''), '5년 누적 배당성향 중앙값'], [rows.length ? jm + '종목' : '–', `${FE} DPS가 ${LA}년의 2배 초과 (무배당 포함)`]].map(([a, b]) => `<div class="kpi"><b>${a}</b><span>${b}</span></div>`).join('');
  drawA(rows); drawB(rows); drawC(filt(true));
}
addEventListener('hashchange', () => { fromHash(); go(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const r = filt(); drawA(r); drawB(r); drawC(filt(true)); }, 120); });
fromHash(); go();
</script>
